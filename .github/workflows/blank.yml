name: PC Virtual - Verificar Hardware

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    # Usa o runner padrão do GitHub.
    # Para hardware dedicado, configure um runner
    # próprio na sua máquina virtual em nuvem.
    runs-on: ubuntu-24.04

    steps:
      - name: Verificar processador e RAM
        run: |
          echo "=== PROCESSADOR ==="
          lscpu | grep -E 'Model name|CPU\(s\)'

          echo "=== MEMORIA RAM ==="
          free -h

          echo "=== ARMAZENAMENTO ==="
          df -h /

          echo "=== PLACA DE VIDEO ==="
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
          else
            echo "GPU NVIDIA nao disponivel neste runner"
          fi
          
